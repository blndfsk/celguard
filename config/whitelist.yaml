plugin:
matcher:
  source_ip: request.headers['x-real-ip']

  rules:
    - name: method
      log: warn
      tests:
        - request.method in ['GET','HEAD','OPTIONS'] != true
      action:
        response: { status: 405, header: { allow: "GET, HEAD, OPTIONS" } }

    - name: empty_agent
      log: warn
      tests:
        - request.headers.contains('user-agent') == false
        - request.headers['user-agent'].trim() == ''
      action:
        response: { status: 401, body: "empty agent" }

    - name: path
      tests:
        - request.path.matches('/\\.')

    - name: whitelist
      log: info
      tests:
        - request.path == '/'
        - request.path == '/status'
        - request.path == '/robots.txt'
        - request.path == '/sitemap.xml'
        - request.path.startsWith('/js/')
        - request.path.startsWith('/css/')
        - request.path.startsWith('/images/')
      action:
        continue: true

    - name: default
      log: warn
