[package]
name = "celguard"
version = "0.1.2"
edition = "2024"
rust-version = "1.88.0"

[dependencies]
http-wasm-guest = "0.11"
serde = { version = "1.0", default-features = false, features = ["derive"]}
serde-saphyr = "0.0.25"
log = "0.4"
cel = "0.13"
anyhow = "1.0"

[dev-dependencies]
test-log = "0.2"
testresult = "0.4.1"


[lints.clippy]
panic = "deny"
unwrap_used = "deny"
missing_assert_message = "warn"
map_unwrap_or = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
string_slice = "warn"
